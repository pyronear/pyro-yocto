# A positive bootdelay makes U-Boot poll tstc() (keypress check) on the
# console for N seconds before autobooting. We tried moving the console to
# uart10 (SoC-native UART, not behind RP1/PCIe) hoping that would make this
# poll safe, but the board still hangs with no output with a positive value.
# Root cause not fully identified; keep -2 (autoboot immediately, tstc()
# never called) so the boot chain remains reliable
# Even on uart10, -2 is also the right choice security-wise: it prevents
# anyone with physical access to the J16 debug connector from breaking
# into an interactive U-Boot prompt and bypassing the RAUC A/B boot chain.
CONFIG_BOOTDELAY=-2
