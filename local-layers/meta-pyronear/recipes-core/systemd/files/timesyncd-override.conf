[Unit]
# /var/lib is volatile tmpfs here (see volatile-binds), so the state
# directory below would never survive a reboot without this. Make sure
# /data and the directory tmpfiles creates on it are ready first.
After=systemd-tmpfiles-setup.service data.mount

[Service]
# StateDirectory= only ever resolves under /var/lib and can't point at an
# absolute path directly, so redirect it via a per-service bind mount to
# /data instead, which does survive reboots.
StateDirectory=systemd/timesync
BindPaths=/data/timesync-state:/var/lib/systemd/timesync
