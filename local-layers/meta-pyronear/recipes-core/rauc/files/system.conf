# ============================================================
# RAUC system configuration — PyroNear RPi5
# ============================================================
# Bootloader : U-Boot (via RPI_USE_U_BOOT = "1")
# Mechanism  : BOOT_ORDER + BOOT_LEFT (U-Boot variables)
# Slots      : rootfsA (/dev/mmcblk0p2) + rootfsB (/dev/mmcblk0p3)
# Data partition (/dev/mmcblk0p4) : NOT managed by RAUC,
#   mounted separately, survives OTA updates.
# ============================================================

[system]
compatible=pyronear-rpi5
bootloader=uboot
bundle-formats=plain

[keyring]
path=/etc/rauc/ca.cert.pem
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
