require conf/machine/raspberrypi5.conf

MACHINEOVERRIDES =. "raspberrypi5:"

# Remove Rpi5 features not used by PyroNear
MACHINE_FEATURES:remove = " \
    screen \
    touchscreen \
    alsa \
    bluetooth \
    pci \
    sdio \
    apm \
    keyboard \
    usbhost \
"

# Disable VC4 graphics
DISABLE_VC4GRAPHICS = "1"

# LICENCES
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# Enable uboor used for dual boot managment
RPI_USE_U_BOOT = "1"

# Enable serial port for debugging and communication
ENABLE_UART = "1"

# Choice of console UART:
# - ENABLE_UART_UART0 = "1" : console on GPIO14/15 (RP1 uart0, via the uart0-pi5 overlay).
#   RP1 is only reachable once Linux brings up it PCIe link,
#   so U-Boot itself stays silent on this uart, only the kernel console works there.
# - ENABLE_UART_UART0 = "0": console on the J16 debug connector (uart10, SoC-native, always available).
#   Both U-Boot's and the kernel's boot logs become visible there.
ENABLE_UART_UART0 ?= "0"

RPI_EXTRA_CONFIG:append = "${@bb.utils.contains('ENABLE_UART_UART0', '1', \
    '\ndtoverlay=uart0-pi5', \
    '', d)}"

# Used by systemd to enable the serial-getty@<tty>.service (agetty login prompt)
# on the selected UART.
SERIAL_CONSOLES = "${@bb.utils.contains('ENABLE_UART_UART0', '1', \
    '115200;ttyAMA0', '115200;ttyAMA10', d)}"

# CMDLINE_SERIAL (meta-raspberrypi) only depends on ENABLE_UART, so the kernel
# console= parameter always points to ttyAMA0 (serial0) regardless of
# ENABLE_UART_UART0. Derive it from SERIAL_CONSOLES ("baudrate;tty") so both
# stay in sync from a single source of truth.
CMDLINE_SERIAL = "${@'console=%s,%s' % tuple(reversed(d.getVar('SERIAL_CONSOLES').split(';')))}"


# HARDWARE & RASPBERRY PI TWEAKS
KERNEL_MODULE_AUTOLOAD += "zram"

# Overlayfs-etc configuration
OVERLAYFS_ETC_MOUNT_POINT = "/data"
OVERLAYFS_ETC_FSTYPE = "ext4"
OVERLAYFS_ETC_DEVICE = "/dev/mmcblk0p4"