BB_CONF_FRAGMENT_SUMMARY = "Fetch known git:// recipes over https"
BB_CONF_FRAGMENT_DESCRIPTION = "Some packages are fetched over plain \
git:// (port 9418), which is blocked on many company/ISP networks. \
Enable this fragment to redirect just those recipes to https instead."

# PREMIRRORS: alternate fetch URLs bitbake tries before the recipe's own
# SRC_URI. One override per recipe (:pn-...) instead of a global rewrite.
PREMIRRORS:prepend:pn-libnftnl = "git://git.netfilter.org/libnftnl$ git://git.netfilter.org/libnftnl;protocol=https \n"
PREMIRRORS:prepend:pn-yocto-cfg-fragments-6.18 = "git://git.yoctoproject.org/yocto-kernel-cache$ git://git.yoctoproject.org/yocto-kernel-cache;protocol=https \n"
