# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pyronear"
BBFILE_PATTERN_meta-pyronear = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pyronear = "6"

LAYERDEPENDS_meta-pyronear = " \
    core \
    raspberrypi \
    virtualization-layer \
    rauc \
"

LAYERSERIES_COMPAT_meta-pyronear = "wrynose"

CREDENTIALS_DIR := "${LAYERDIR}/../../credentials"
RAUC_CREDENTIALS_DIR := "${CREDENTIALS_DIR}/rauc"
RAUC_CERT_FILE := "${RAUC_CREDENTIALS_DIR}/rauc.cert.pem"
RAUC_KEY_FILE := "${RAUC_CREDENTIALS_DIR}/rauc.key.pem"

# Filename only (not a path): resolved via FILESEXTRAPATHS/RAUC_CREDENTIALS_DIR
# by the file:// fetcher in rauc-conf.bbappend.
RAUC_CA_FILE := "rauc-ca.cert.pem"
